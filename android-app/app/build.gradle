plugins {
    id 'com.android.application'
}

android {
    namespace 'no.weblynorge.app'
    compileSdk 36

    defaultConfig {
        applicationId 'no.weblynorge.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
